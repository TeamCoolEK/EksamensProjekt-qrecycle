spring.datasource.url=${PROD_URL}
spring.datasource.username=${PROD_USERNAME}
spring.datasource.password=${PROD_PASSWORD}

# CROSS origin til vores domæne
app.cors.allowed-origins=${ALLOWED_ORIGIN}

# Safe in prod, dræber forbindelsen hvis schema ikke stemmer overens, lækker ikke sql logs i prod
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

# Healthchecks i VM
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Sikre HTTPS forbindelser når frem (da vores frontend serviceres af en reverse proxy (NGINX))
server.forward-headers-strategy=native