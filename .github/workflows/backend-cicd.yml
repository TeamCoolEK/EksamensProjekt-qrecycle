name: CI/CD

on:
  push:
    branches: [main, Dev, test]
  pull_request:
    branches: [main, Dev, test]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: ./mvnw clean verify -B

  build-and-push-backend:
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Dev')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          #Fortæller docker at Dockerfilen skal hentes fra root mappen (vores repository)
          context: .
          push: true
          tags: |
            ghcr.io/teamcoolek/qrecycle-backend:latest
            ghcr.io/teamcoolek/qrecycle-backend:${{ github.sha }}

  deploy:
    needs: build-and-push-backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Oracle VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            
            cd ~/qrecycle
            
            echo "PROD_URL=${{ secrets.PROD_URL }}" > .env
            echo "PROD_PASSWORD=${{ secrets.PROD_PASSWORD }}" >> .env
            echo "PROD_USERNAME=${{ secrets.PROD_USERNAME }}" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            echo "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}" >> .env
            echo "ALLOWED_ORIGIN=https://teamcool.swag.dk" >> .env
          
            docker compose -f docker-compose.yml pull
            docker compose -f docker-compose.yml down --remove-orphans
            docker compose -f docker-compose.yml up -d

            docker image prune -f