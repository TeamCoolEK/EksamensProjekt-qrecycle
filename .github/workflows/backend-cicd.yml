name: CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main, Dev, test]
  pull_request:
    branches: [main, Dev, test]


jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Java 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven # cache key med hashed pom.xml gemt i .m2/repository

      - name: Build and test
        run: ./mvn clean verify -B
        # Clean sletter target/ mappen, og bygger fra scratch
        # Compiler, køre unit tests, køre intergrations tests (Verify)
        # -b batch mode = køre uden interactive prompts, da ingen mennesker kigger på den i terminalen

  build-and-push-backend:
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Dev')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout backend
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v.3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          #Fortæller docker at Dockerfilen skal hentes fra root mappen (vores repository)
          context: .
          push: true
          tags: |
            ghcr.io/teamcoolek/qrecycle-backend:latest
            ghcr.io/teamcoolek/qrecycle-backend:${{ github.sha }}

  deploy:
    needs: build-and-push-backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Oracle VM
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            
            cd ~/qrecycle
            
            echo "PROD_URL=${{ secrets.PROD_URL }}" > .env
            echo "PROD_PASSWORD=${{ secrets.PROD_PASSWORD }}" >> .env
            echo "PROD_USERNAME=${{ secrets.PROD_USERNAME }}" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            echo "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}" >> .env
            echo "SPRING_PROFILES_ACTIVE=PROD" >> .env
          
            docker compose -f docker-compose.yml pull
            docker compose -f docker-compose.yml down --remove-orphans
            docker compose -f docker-compose.yml up -d

            docker image prune -f